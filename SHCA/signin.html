<!-- SIGNIN PAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Data -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Login</title>
    <!-- Links and Stylesheets -->
    <link rel="stylesheet" href="css/backgrounds.css"> <!-- Gives the page the background from Figma -->
</head>
<body class="accounts"> 
    <!-- GLOBAL HEADER -->
    <header>
        <!-- Logo -->
        <img src="images/logo.svg" alt="A picture of a book behind a graduation cap with a heart inside of it.">
    </header>

    <!-- MAIN -->
    <main>
        <!-- The Sign-in Box -SR -->
        <form action="">
            <div> <!-- Heading Section -->
                <h1>Sign In</h1>
                <p>or <a href="creation.html">create an account</a></p>
            </div>
            <div> <!-- Username Section -->
                <label for="s_username">Username</label>
                <input type="text" id="s_username" name="s_username" placeholder="User1234">
            </div>
            <div> <!-- Password Section -->
                <label for="s_password">Password</label>
                <input type="text" id="s_password" name="s_password">
            </div>
            <div> <!-- Remember Me Section -->
                <input type="checkbox" id="s_remember" name="s_remember">
                <label for="s_remember">Remember Me</label>
            </div>
            <div> <!-- Submit Button Section -->
                <button type="submit">Sign In</button>
            </div>
        </form> <!-- END of Sign-in Box -->
    </main>

    <!-- GLOBAL FOOTER -->
    <footer>

    </footer>
</body>
</html>
