<!-- ACCOUNT CREATION PAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Data -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Account Creation</title>
    <!-- Links and Stylesheet -->
     <link rel="stylesheet" href="css/backgrounds.css"> <!-- Gives the page the background from Figma -->
</head>
<body class="accounts">
    <!-- GLOBAL HEADER -->
    <header>
        <!-- Logo --> <!-- Probably going to move this down??? -SR -->
        <img src="images/logo.svg" alt="A picture of a book behind a graduation cap with a heart inside of it.">
    </header>

    <!-- MAIN -->
    <main>
        <!-- The Account Creation Box -SR -->
         <form action="" method="">
            <div> <!-- Heading for the box -->
                <h1>Account Creation</h1>
                <p>or <a href="signin.html">sign in here</a></p> 
            </div>
            <div> <!-- Username Section -->
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="burgerPleaseFRFR" required>
            </div>
            <div> <!-- Insurance Section -->
                INSURANCE
            </div>
            <div> <!-- Password Section -->
                <label for="password">Password</label>
                <input type="text" id="password" name="password" required>
            </div>
            <div>
                <label for="confirm_pw">Confirm Password</label>
                <input type="text" id="confirm_pw" name="confirm_pw" required>
            </div>
            <div> <!-- Remember Me Checkbox -->
                <input type="checkbox" id="remember" name="remember">
                <label for="checkbox" id="remember">Remember Me</label>
            </div>
            <div> <!-- Create Button section -->
                <button type="submit">Create Account</button>
                <a href="dashboard.html">Go to Dashboard</a>
            </div>
            <!-- THIS IS WHERE WE WILL TAKE DATA AND THEN SEND IT OFF TO THE BACKEND -SR -->
         </form>
    </main>

    <!-- GLOBAL FOOTER -->
    <footer>

    </footer>
</body>
</html>
